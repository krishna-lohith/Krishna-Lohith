<svg viewBox="0 0 1000 104" width="1000" height="104" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: building">
<style>
.m{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fd{opacity:0;animation:fd .7s ease forwards}
@keyframes fd{to{opacity:1}}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ln 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}.d6{animation-delay:1.1s}.d7{animation-delay:1.3s}.d8{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){.up,.fd,.ln{animation:none;opacity:1;stroke-dashoffset:0}}
.ring{animation:ri 2.4s ease-out infinite;transform-origin:62px 58px}@keyframes ri{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.8);opacity:0}}</style>
<rect x="0.5" y="0.5" width="999" height="103" rx="10" fill="#0A0A0A" stroke="#1E1E1E"/>
<line class="ln" x1="48" y1="20" x2="952" y2="20" stroke="#1E1E1E"/>
<circle class="ring" cx="62" cy="58" r="5" stroke="#FFC400" fill="none"/>
<circle class="pulse" cx="62" cy="58" r="4" fill="#FFC400"/>
<text class="m " x="84" y="56" font-size="13" fill="#E8E8E8" letter-spacing="3" text-anchor="start" font-weight="normal">STATUS / BUILDING</text>
<text class="m " x="84" y="76" font-size="12" fill="#BDBDBD" letter-spacing="1.5" text-anchor="start" font-weight="normal">probably debugging a prompt past midnight</text>
<text class="m " x="952" y="62" font-size="14" fill="#BDBDBD" letter-spacing="0" text-anchor="end" font-weight="normal">medium.com/@Krishnam963  ·  USA</text>
</svg>