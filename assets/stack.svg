<svg viewBox="0 0 1000 256" width="1000" height="256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech stack">
<style>
.m{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fd{opacity:0;animation:fd .7s ease forwards}
@keyframes fd{to{opacity:1}}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ln 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}.d6{animation-delay:1.1s}.d7{animation-delay:1.3s}.d8{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){.up,.fd,.ln{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
<rect x="0.5" y="0.5" width="999" height="255" rx="10" fill="#0A0A0A" stroke="#1E1E1E"/>
<line x1="150" y1="14" x2="150" y2="240" stroke="#1E1E1E"/>
<text class="m up d1" x="48" y="40" font-size="11.5" fill="#8C8C8C" letter-spacing="2" text-anchor="start" font-weight="normal">LANGUAGES</text>
<text class="m up d1" x="170" y="40" font-size="15" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="normal">Java · Python · JavaScript · HTML · CSS · SQL</text>
<text class="m up d2" x="48" y="76" font-size="11.5" fill="#8C8C8C" letter-spacing="2" text-anchor="start" font-weight="normal">WEB</text>
<text class="m up d2" x="170" y="76" font-size="15" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="normal">React · Node.js · REST APIs · Responsive UI</text>
<text class="m up d3" x="48" y="112" font-size="11.5" fill="#8C8C8C" letter-spacing="2" text-anchor="start" font-weight="normal">CLOUD</text>
<text class="m up d3" x="170" y="112" font-size="15" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="normal">AWS · Docker · Git · Linux</text>
<text class="m up d4" x="48" y="148" font-size="11.5" fill="#FFC400" letter-spacing="2" text-anchor="start" font-weight="normal">GEN AI</text>
<text class="m up d4" x="170" y="148" font-size="15" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="normal">LLMs · RAG · LangChain · Hugging Face · MCP</text>
<text class="m up d5" x="48" y="184" font-size="11.5" fill="#8C8C8C" letter-spacing="2" text-anchor="start" font-weight="normal">CONCEPTS</text>
<text class="m up d5" x="170" y="184" font-size="15" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="normal">Tokens · Embeddings · Prompt Engineering · Vector Search</text>
<text class="m up d6" x="48" y="220" font-size="11.5" fill="#8C8C8C" letter-spacing="2" text-anchor="start" font-weight="normal">TOOLS</text>
<text class="m up d6" x="170" y="220" font-size="15" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="normal">Claude · ChatGPT · VS Code · GitHub</text>
</svg>