<svg viewBox="0 0 1000 392" width="1000" height="392" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Krishna, Software Developer and Gen AI Engineer">
<style>
.m{font-family:ui-monospace,'SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fd{opacity:0;animation:fd .7s ease forwards}
@keyframes fd{to{opacity:1}}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ln 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.blink{animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}.d6{animation-delay:1.1s}.d7{animation-delay:1.3s}.d8{animation-delay:1.5s}
@media (prefers-reduced-motion:reduce){.up,.fd,.ln{animation:none;opacity:1;stroke-dashoffset:0}}

.rot{opacity:0;animation:rot 12s linear infinite}
.r1{animation-delay:1.6s}.r2{animation-delay:5.6s}.r3{animation-delay:9.6s}
@keyframes rot{0%{opacity:0}2%{opacity:1}30%{opacity:1}33%{opacity:0}100%{opacity:0}}
</style>
<rect x="0.5" y="0.5" width="999" height="391" rx="10" fill="#0A0A0A" stroke="#1E1E1E"/>
<line class="ln d1" x1="48" y1="62" x2="952" y2="62" stroke="#1E1E1E" stroke-width="1"/>
<g class="fd d1"><text class="m " x="48" y="46" font-size="11" fill="#8C8C8C" letter-spacing="3.5" text-anchor="start" font-weight="normal">SYS://KRISHNA  /  PROFILE INDEX 001</text><circle class="pulse" cx="800" cy="42" r="4" fill="#FFC400"/><text class="m " x="952" y="46" font-size="11" fill="#FFC400" letter-spacing="3.5" text-anchor="end" font-weight="normal">SIGNAL ONLINE</text></g>
<g class="up d2"><text class="m " x="44" y="170" font-size="78" fill="#E8E8E8" letter-spacing="0" text-anchor="start" font-weight="bold" textLength="311" lengthAdjust="spacingAndGlyphs">Krishna</text><rect class="blink" x="373" y="114" width="18" height="60" fill="#FFC400"/></g>
<g class="fd d3"><text class="m " x="48" y="214" font-size="20" fill="#8C8C8C" letter-spacing="0" text-anchor="start" font-weight="normal">Software Developer  &amp;  Gen AI Engineer</text></g>
<g class="fd d4"><text class="m " x="48" y="268" font-size="13" fill="#5A5A5A" letter-spacing="1" text-anchor="start" font-weight="normal">focus  &#9656;</text><text class="m " x="140" y="268" font-size="13" fill="#FFC400" letter-spacing="1" text-anchor="start" font-weight="normal">Java · Python · Web · AWS · LLMs · RAG · Tokens</text></g>
<text class="m fd d5" x="48" y="296" font-size="13" fill="#5A5A5A" letter-spacing="0" text-anchor="start" font-weight="normal">&gt;</text><text class="m rot r1" x="70" y="296" font-size="13" fill="#E8E8E8" letter-spacing="1" text-anchor="start" font-weight="normal">turning tokens into products</text><text class="m rot r2" x="70" y="296" font-size="13" fill="#E8E8E8" letter-spacing="1" text-anchor="start" font-weight="normal">building software that thinks</text><text class="m rot r3" x="70" y="296" font-size="13" fill="#E8E8E8" letter-spacing="1" text-anchor="start" font-weight="normal">clean code by day, embeddings by night</text>
<line class="ln d5" x1="48" y1="334" x2="952" y2="334" stroke="#1E1E1E" stroke-width="1"/>
<g class="fd d6"><text class="m " x="48" y="364" font-size="11.5" fill="#8C8C8C" letter-spacing="3" text-anchor="start" font-weight="normal">SOFTWARE</text><text class="m " x="150" y="364" font-size="11.5" fill="#FFC400" letter-spacing="0" text-anchor="start" font-weight="normal">·</text><text class="m " x="176" y="364" font-size="11.5" fill="#8C8C8C" letter-spacing="3" text-anchor="start" font-weight="normal">GEN AI</text><text class="m " x="260" y="364" font-size="11.5" fill="#FFC400" letter-spacing="0" text-anchor="start" font-weight="normal">·</text><text class="m " x="286" y="364" font-size="11.5" fill="#8C8C8C" letter-spacing="3" text-anchor="start" font-weight="normal">CLOUD</text><text class="m " x="952" y="364" font-size="11.5" fill="#8C8C8C" letter-spacing="3" text-anchor="end" font-weight="normal">BASED IN THE USA</text></g>
</svg>